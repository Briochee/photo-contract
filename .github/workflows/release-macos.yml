name: macOS Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out all release tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check and report the application version
        id: version
        run: |
          release_version="$(python3 scripts/check_release_version.py)"
          echo "version=${release_version}" >> "$GITHUB_OUTPUT"

  build-and-release:
    needs: preflight
    runs-on: macos-14
    environment: production
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      CSC_NAME: ${{ vars.CSC_NAME }}
    steps:
      - name: Require production signing and notarization secrets
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Refusing to build or publish. Configure these secrets in the production environment: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install packaging dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-packaging.txt
          .venv/bin/python -m playwright install chromium
          npm ci --prefix frontend

      - name: Prepare isolated signing keychain directory
        run: |
          APP_BUILDER_TMP_DIR="$RUNNER_TEMP/contract-studio-signing"
          mkdir -p "$APP_BUILDER_TMP_DIR"
          echo "APP_BUILDER_TMP_DIR=$APP_BUILDER_TMP_DIR" >> "$GITHUB_ENV"

      - name: Build, sign, and notarize Contract Studio
        run: npm run build:mac --prefix frontend
        env:
          PHOTO_STUDIO_NOTARIZE: "1"
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Archive the notarized app bundle
        id: archive
        run: |
          app_path="release/mac-arm64/Contract Studio.app"
          test -d "$app_path"
          asset_path="release/Contract-Studio-macOS-arm64-v${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$asset_path"
          shasum -a 256 "$asset_path" > "${asset_path}.sha256"
          echo "asset_path=${asset_path}" >> "$GITHUB_OUTPUT"

      - name: Publish downloadable GitHub Release
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Contract Studio v${VERSION} for Apple Silicon Macs.

          Download and unzip the archive, then move **Contract Studio.app** to **/Applications**.
          The application is Developer ID signed and notarized by Apple.
          The SHA-256 checksum is included alongside the archive.
          EOF
          gh release create "v${VERSION}" \
            "${{ steps.archive.outputs.asset_path }}" \
            "${{ steps.archive.outputs.asset_path }}.sha256" \
            --target "$GITHUB_SHA" \
            --title "Contract Studio v${VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          keychain_dir="$RUNNER_TEMP/contract-studio-signing"
          if [[ -d "$keychain_dir" ]]; then
            while IFS= read -r -d '' keychain; do
              security delete-keychain "$keychain" >/dev/null 2>&1 || rm -f "$keychain"
            done < <(find "$keychain_dir" -type f -name '*.keychain' -print0)
            rm -rf "$keychain_dir"
          fi
